[project]
name = "telegram-automation-bot"
version = "1.0.0"
description = "Telegram automation and management bot (aiogram 3, SQLite/PostgreSQL-ready repository layer)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.20,<1",
    "APScheduler>=3.10,<4",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

